name: GitManager
options:
  # Keep test bundles free of the target preset's BUNDLE_LOADER setting.
  settingPresets: project
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SDKROOT: macosx
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGNING_REQUIRED: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  GitManagerCore:
    type: framework
    platform: macOS
    sources:
      - GitManager/Models
      - GitManager/Git
      - GitManager/Services
      - GitManager/AppModel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alldeploy.gitmanager.core
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
  GitManager:
    type: application
    platform: macOS
    sources:
      - path: GitManager
        excludes: [Models, Git, Services, AppModel.swift, Assets.xcassets]
      - path: GitManager/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: GitManagerCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alldeploy.gitmanager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Git Manager
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
  GitManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [GitManagerTests]
    dependencies:
      - target: GitManagerCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alldeploy.gitmanager.tests
schemes:
  GitManager:
    build:
      targets:
        GitManager: all
    test:
      targets: [GitManagerTests]
    run:
      config: Debug
